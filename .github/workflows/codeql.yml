name: CodeQL security analysis

on:
  push:
    branches: [main, docs/project-source-reorg]
  pull_request:
    branches: [main, docs/project-source-reorg]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL - ${{ matrix.language }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Restore WDK and build native code
        if: matrix.language == 'cpp'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore driver\packages.config -PackagesDirectory driver\packages
          if ($LASTEXITCODE -ne 0) { throw "WDK NuGet restore failed: $LASTEXITCODE" }
          cmd /c build.cmd
          if ($LASTEXITCODE -ne 0) { throw "Native core build failed: $LASTEXITCODE" }
          cmd /c build_driver.cmd Release
          if ($LASTEXITCODE -ne 0) { throw "WDK driver build failed: $LASTEXITCODE" }

      - name: Setup .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build C# utility
        if: matrix.language == 'csharp'
        run: dotnet build ui/LdacConfig -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
