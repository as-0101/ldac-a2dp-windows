name: WDM SysVAD baseline control
on:
  push:
    branches: [research/wdm-profile-reengineering]
    paths: ['.github/workflows/wdm-sysvad-control.yml', 'research/wdm-portcls/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portcls-control:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout project build infrastructure
        uses: actions/checkout@v4
        with:
          path: project
      - name: Checkout pinned official Microsoft SysVAD
        uses: actions/checkout@v4
        with:
          repository: microsoft/Windows-driver-samples
          ref: d49bb7d72f3651952b2b6e4ad28d14fe2247eb69
          path: upstream
          submodules: recursive
          persist-credentials: false
      - name: Add MSBuild to path
        uses: microsoft/setup-msbuild@v2
      - name: Audit pinned original source before build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          python -m unittest discover -s project/research/wdm-portcls -p 'test_wdm_sysvad_audit.py' -v 2>&1 | Tee-Object evidence/audit-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Audit unit tests failed' }
          python project/research/wdm-portcls/wdm_sysvad_audit.py --root upstream --out evidence/sysvad-static.json
          if ($LASTEXITCODE -ne 0) { throw 'Source gate failed' }
      - name: Restore existing NuGet WDK 26100 toolchain
        shell: pwsh
        run: |
          nuget restore project/driver/packages.config -PackagesDirectory upstream/packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "NuGet WDK restore failed: $LASTEXITCODE" }
      - name: Resolve WDK stampinf.exe from restored packages
        shell: pwsh
        run: |
          $roots = @('upstream/packages', 'C:/Program Files (x86)/Windows Kits/10') | Where-Object { Test-Path -LiteralPath $_ }
          $stamps = @($roots | ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter stampinf.exe -Recurse -File -ErrorAction SilentlyContinue } | Where-Object { $_.Directory.Name -ieq 'x64' } | Sort-Object FullName)
          $stamps | Select-Object -ExpandProperty FullName | Set-Content evidence/stampinf-candidates.txt
          if (!$stamps.Count) { throw 'WDK StampInf missing from restored NuGet and installed SDK: inspect evidence/stampinf-candidates.txt' }
          $dir = $stamps[0].Directory.FullName
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "selected_stampinf=$($stamps[0].FullName)" | Add-Content evidence/runner.txt
      - name: Inspect WDK INF verification target and available tools
        shell: pwsh
        run: |
          $toolRoots = @('upstream/packages', 'C:/Program Files (x86)/Windows Kits/10') | Where-Object { Test-Path -LiteralPath $_ }
          $names = @('infverif.exe', 'infverif.dll')
          $found = foreach ($root in $toolRoots) { foreach ($name in $names) { Get-ChildItem -LiteralPath $root -Recurse -File -Filter $name -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName } }
          @($found) | Set-Content evidence/infverif-paths.txt
          $targetFile = Get-ChildItem -LiteralPath 'upstream/packages' -Recurse -File -Filter WindowsDriver.common.targets -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($targetFile) {
            "wdk_targets=$($targetFile.FullName)" | Set-Content evidence/infverif-target-context.txt
            Select-String -LiteralPath $targetFile.FullName -Pattern 'InfVerif|RunInfVerif|InfVerifToolPath' -Context 2,3 | Out-String -Width 260 | Add-Content evidence/infverif-target-context.txt
          }
      - name: Apply isolated INF-2663 regression fix to pinned SysVAD checkout
        shell: pwsh
        run: |
          # Baseline code stays pinned and unchanged in GitHub. Modify only this disposable CI checkout.
          $path = 'upstream/audio/sysvad/TabletAudioSample/ComponentizedAudioSample.inx'
          $before = Get-Content -LiteralPath $path -Raw
          $needle = 'Needs=KS.Registration, WDMAUDIO.Registration'
          $after = 'Needs=KS.Registration, WDMAUDIO.Registration, MsApoFxProxy.Registration'
          $count = ([regex]::Matches($before, [regex]::Escape($needle))).Count
          if ($count -ne 1) { throw "Unexpected SysVAD INF baseline: expected one Needs line, found $count" }
          $updated = $before.Replace($needle, $after)
          $updated | Set-Content -LiteralPath $path -Encoding utf8 -NoNewline
          if (([regex]::Matches((Get-Content -LiteralPath $path -Raw), [regex]::Escape($after))).Count -ne 1) { throw 'INF regression patch not applied exactly once' }
          "origin=Microsoft SysVAD d49bb7d72f3651952b2b6e4ad28d14fe2247eb69" | Set-Content evidence/inf-2663-patch.txt
          "reason=InfVerif ERROR(2663) at SYSVAD_SA.NT Needs missing MsApoFxProxy.Registration" | Add-Content evidence/inf-2663-patch.txt
          "old=$needle" | Add-Content evidence/inf-2663-patch.txt
          "new=$after" | Add-Content evidence/inf-2663-patch.txt
          "modified_source_sha256=$((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash)" | Add-Content evidence/inf-2663-patch.txt
      - name: Build EndpointsCommon x64 then locally INF-patched TabletAudioSample
        shell: pwsh
        run: |
          Copy-Item project/driver/Directory.Build.props upstream/Directory.Build.props -Force
          $common = 'upstream/audio/sysvad/EndpointsCommon/EndpointsCommon.vcxproj'
          & msbuild $common /m /nologo /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /v:minimal '/flp:logfile=evidence/endpoints-msbuild.log;verbosity=normal'
          $depRc = $LASTEXITCODE
          "endpoints_msbuild_exit_code=$depRc" | Set-Content evidence/exit-code.txt
          if ($depRc -ne 0) { throw "EndpointsCommon control MSBuild failed, code $depRc" }
          $libs = @(Get-ChildItem 'upstream/audio/sysvad/EndpointsCommon' -Recurse -File -Filter EndpointsCommon.lib -ErrorAction SilentlyContinue)
          $libs | ForEach-Object { "$($_.FullName) $($_.Length) $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" } | Set-Content evidence/endpoints-lib-sha256.txt
          if (!$libs.Count) { throw 'EndpointsCommon built without producing required .lib' }
          $sample = 'upstream/audio/sysvad/TabletAudioSample/TabletAudioSample.vcxproj'
          # This is COMPILE-ONLY: the NuGet x64 WDK does not include the x86 INF/API DLLs the built-in MSBuild tasks request.
          # Run standalone x64 InfVerif separately, NEVER label this a validated or installable driver package.
          & msbuild $sample /m /nologo /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:SkipPackageVerification=true /p:ApiValidator_Enable=false /p:RunApiValidator=false /v:minimal '/flp:logfile=evidence/sysvad-msbuild.log;verbosity=normal'
          $rc = $LASTEXITCODE
          "tablet_compile_only_exit_code=$rc" | Add-Content evidence/exit-code.txt
          if ($rc -ne 0) { throw "SysVAD compile-only MSBuild failed, code $rc" }
      - name: Independently inspect generated INF files with x64 InfVerif
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath 'upstream/packages' -Recurse -File -Filter InfVerif.exe | Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (!$exe) { throw 'Standalone x64 InfVerif.exe missing' }
          $infs = @(Get-ChildItem 'upstream/audio/sysvad/TabletAudioSample/x64/Release' -File -Filter '*.inf' -ErrorAction SilentlyContinue)
          if (!$infs.Count) { throw 'No generated INF to verify independently' }
          $failed = @()
          foreach ($inf in $infs) {
            "INF=$($inf.Name)" | Add-Content evidence/infverif-standalone.txt
            & $exe.FullName /h $inf.FullName 2>&1 | Out-String -Width 240 | Add-Content evidence/infverif-standalone.txt
            "infverif_$($inf.Name)_exit_code=$LASTEXITCODE" | Add-Content evidence/exit-code.txt
            if ($LASTEXITCODE -ne 0) { $failed += $inf.Name }
          }
          if ($failed.Count) { throw "Standalone x64 InfVerif failed: $($failed -join ', '); see artifact" }
      - name: Capture control metadata and output hashes (no binaries)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $version = Get-ItemProperty 'HKLM:/SOFTWARE/Microsoft/Windows NT/CurrentVersion'
          "runner_build=$($version.CurrentBuildNumber);UBR=$($version.UBR)" | Set-Content evidence/runner.txt
          "upstream_commit=d49bb7d72f3651952b2b6e4ad28d14fe2247eb69" | Add-Content evidence/runner.txt
          "wdk_nuget=10.0.26100.6584" | Add-Content evidence/runner.txt
          Get-ChildItem upstream/audio/sysvad -Recurse -File -Include *.sys,*.inf,*.cat -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name) $($_.Length) $((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)" } | Set-Content evidence/outputs-sha256.txt
          if (Test-Path upstream/audio/sysvad/TabletAudioSample/ComponentizedAudioSample.inx) { Select-String -Path upstream/audio/sysvad/TabletAudioSample/ComponentizedAudioSample.inx -Pattern '^(Include|Needs|AddInterface|AddService|CatalogFile)\s*=' | Select-Object -ExpandProperty Line | Set-Content evidence/inf-directives.txt }
      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdm-sysvad-control-metadata
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
