name: ACX runtime LiveKD probe

on:
  push:
    branches:
      - research/acx-runtime-livekd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect hosted Server 2022 ACX class through LiveKD
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Obtain portable WinDbg console tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'acx-livekd'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $appInstallerPath = Join-Path $root 'windbg.appinstaller'
          Invoke-WebRequest 'https://aka.ms/windbg/download' -OutFile $appInstallerPath
          [xml]$appInstaller = Get-Content $appInstallerPath
          $bundleNode = $appInstaller.SelectSingleNode("//*[local-name()='MainBundle']")
          if (-not $bundleNode) { throw 'WinDbg appinstaller does not contain MainBundle' }
          $bundleUrl = $bundleNode.GetAttribute('Uri')
          if (-not $bundleUrl) { throw 'WinDbg appinstaller MainBundle Uri is empty' }

          $bundlePath = Join-Path $root 'windbg.msixbundle'
          Invoke-WebRequest $bundleUrl -OutFile $bundlePath
          $bundleZip = Join-Path $root 'windbg-bundle.zip'
          Copy-Item $bundlePath $bundleZip
          Expand-Archive -LiteralPath $bundleZip -DestinationPath (Join-Path $root 'bundle') -Force

          $msix = Get-ChildItem (Join-Path $root 'bundle') -Filter '*.msix' -Recurse |
            Where-Object { $_.Name -match 'x64' } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $msix) { throw 'WinDbg x64 MSIX package not found in bundle' }

          $msixZip = Join-Path $root 'windbg-x64.zip'
          Copy-Item $msix.FullName $msixZip
          $packageDir = Join-Path $root 'windbg-package'
          Expand-Archive -LiteralPath $msixZip -DestinationPath $packageDir -Force
          $kd = Get-ChildItem $packageDir -Filter 'kdX64.exe' -Recurse | Select-Object -First 1
          if (-not $kd) { throw 'kdX64.exe not found in the official WinDbg x64 package' }
          Write-Host "Portable KD: $($kd.FullName)"
          "KD_PATH=$($kd.FullName)" | Out-File (Join-Path $root 'kd-path.txt') -Encoding utf8

      - name: Capture and inspect live kernel state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'acx-livekd'

          $os = Get-CimInstance Win32_OperatingSystem
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $sys = foreach ($name in @('Acx01000.sys','Wdf01000.sys')) {
            $path = Join-Path $env:windir "System32\drivers\$name"
            if (Test-Path $path) {
              $f = Get-Item $path
              $h = Get-FileHash $path -Algorithm SHA256
              [pscustomobject]@{Name=$name;FileVersion=$f.VersionInfo.FileVersion;Length=$f.Length;SHA256=$h.Hash;LastWriteTimeUtc=$f.LastWriteTimeUtc}
            }
          }
          [pscustomobject]@{OS=$os.Caption;Version=$os.Version;Build=$os.BuildNumber;UBR=$cv.UBR;Drivers=$sys;HotFixes=(Get-HotFix | Sort-Object InstalledOn -Descending | Select-Object -First 8 HotFixID,InstalledOn)} |
            ConvertTo-Json -Depth 6 | Set-Content (Join-Path $root 'system-info.json') -Encoding utf8

          $service = Get-CimInstance Win32_SystemDriver -Filter "Name='Acx01000'"
          if ($service -and -not $service.Started) {
            Write-Host 'Attempting to start the inbox ACX class-extension service on this disposable hosted runner only...'
            & sc.exe start Acx01000
            "SC_START_EXIT=$LASTEXITCODE" | Out-File (Join-Path $root 'service-start.txt') -Encoding utf8
            Start-Sleep -Seconds 3
          } elseif ($service) {
            'ACX service already started' | Out-File (Join-Path $root 'service-start.txt') -Encoding utf8
          } else {
            'ACX service not registered' | Out-File (Join-Path $root 'service-start.txt') -Encoding utf8
          }

          $zip = Join-Path $root 'LiveKD.zip'
          Invoke-WebRequest 'https://download.sysinternals.com/files/LiveKD.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $root 'livekd') -Force
          $livekd = Get-ChildItem (Join-Path $root 'livekd') -Filter livekd.exe -Recurse | Select-Object -First 1
          if (-not $livekd) { throw 'LiveKD executable not found in official Sysinternals archive' }

          New-Item -Path 'HKCU:\Software\Sysinternals\LiveKd' -Force | Out-Null
          New-ItemProperty -Path 'HKCU:\Software\Sysinternals\LiveKd' -Name EulaAccepted -PropertyType DWord -Value 1 -Force | Out-Null

          $dump = Join-Path $root 'kernel-live.dmp'
          Write-Host 'Capturing a native kernel live dump with Sysinternals LiveKD...'
          & $livekd.FullName -ml -o $dump
          $livekdExit = $LASTEXITCODE
          "LIVEKD_EXIT=$livekdExit" | Out-File (Join-Path $root 'result.txt') -Encoding utf8
          if ($livekdExit -ne 0 -or -not (Test-Path $dump)) { throw "LiveKD dump capture failed, exit=$livekdExit" }
          $dumpInfo = Get-Item $dump
          Write-Host "Kernel dump size: $($dumpInfo.Length)"

          $kdPath = (Get-Content (Join-Path $root 'kd-path.txt' -Raw)).Trim().Substring(8)
          $log = Join-Path $root 'wdfldr-output.txt'
          $cmd = '.symfix C:\Symbols; .reload /f; !wdfkd.wdfldr Acx01000.sys; q'
          Write-Host 'Running KD against the live dump and querying ACX class binding...'
          Push-Location (Split-Path $kdPath)
          try {
            & $kdPath -z $dump -c $cmd 2>&1 | Tee-Object -FilePath $log
            $kdExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          "KD_EXIT=$kdExit" | Out-File (Join-Path $root 'result.txt') -Append -Encoding utf8
          if (-not (Test-Path $log)) { throw 'KD did not create debugger output' }
          if ((Get-Content $log -Raw) -notmatch 'CLASS_MODULE') {
            Write-Warning 'No CLASS_MODULE block was found; preserve the debugger output for diagnosis.'
          }

      - name: Upload text report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acx-runtime-livekd-report
          path: |
            ${{ runner.temp }}/acx-livekd/*.txt
            ${{ runner.temp }}/acx-livekd/*.json
          if-no-files-found: warn
          retention-days: 7
