name: Inspect original Windows 10 HFP donor
on:
  push:
    branches: [experiment/native-donor-inf-20261124]
    paths: [.github/workflows/hfp-donor.yml, tools/research/inspect_hfp_donor.ps1]
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pefile==2024.8.26
      - name: Read HFP package from a read-only donor WIM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in 'tools/research/extract_uup_image_a2dp.ps1','tools/research/inspect_hfp_donor.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors) { throw ($errors -join [Environment]::NewLine) }
          }
          if ([Environment]::OSVersion.Version.Build -ne 20348) { throw 'Wrong runner build' }
          ./tools/research/extract_uup_image_a2dp.ps1 -Win10Only -HfpInventory -OutputDirectory build/hfp-donor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hfp-win10-metadata
          path: |
            build/hfp-donor/hfp-donor.json
            build/hfp-donor/hfp-pe/*.json
            build/hfp-donor/service-registrations.json
            build/hfp-donor/manifest.json
          retention-days: 7
