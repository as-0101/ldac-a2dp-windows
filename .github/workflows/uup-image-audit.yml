name: UUP image A2DP audit

on:
  push:
    branches:
      - experiment/win10-a2dp-uup-image-audit-20261124
      - experiment/win10-a2dp-catalog-registry-audit-20261124
      - experiment/win10-a2dp-cross-sku-catalog-audit-20261124
    paths:
      - tools/research/extract_uup_image_a2dp.ps1
      - tools/research/audit_pe_binary.py
      - tests/test_audit_pe_binary.py
      - .github/workflows/uup-image-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-uup-image-audit:
    name: Win10 19045.5917 vs Server 20348.5761 catalog and registry audit
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned PE parser
        run: python -m pip install --disable-pip-version-check --no-input pefile==2024.8.26

      - name: Run PE parser regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate PowerShell script syntax and SignTool availability
        shell: pwsh
        run: |
          $scriptPath = (Resolve-Path "./tools/research/extract_uup_image_a2dp.ps1").Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            throw "PowerShell parser rejected extract_uup_image_a2dp.ps1."
          }
          $kitsRoot = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Windows Kits\10\bin"
          $signTool = Get-ChildItem -LiteralPath $kitsRoot -Filter "signtool.exe" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "Windows SDK x64 SignTool not found under $kitsRoot." }
          Write-Host "PowerShell syntax OK; SignTool=$($signTool.FullName)"

      - name: Download exact UUP images and audit components offline
        shell: pwsh
        run: ./tools/research/extract_uup_image_a2dp.ps1 -OutputDirectory build/uup-image-audit

      - name: Remove any residual image or binary payloads
        if: always()
        shell: pwsh
        run: |
          $root = "build/uup-image-audit"
          if (Test-Path $root) {
            Remove-Item "$root/server-reference" -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item "$root/win10-package-files" -Recurse -Force -ErrorAction SilentlyContinue
            Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in @(".sys", ".dll", ".exe", ".drv", ".inf", ".cat", ".iso", ".wim", ".esd", ".psf", ".cab", ".msu") } |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

      - name: Upload metadata and text reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uup-image-a2dp-audit-metadata
          path: |
            build/uup-image-audit/README.md
            build/uup-image-audit/manifest.json
            build/uup-image-audit/inf-summary.txt
            build/uup-image-audit/component-hits.json
            build/uup-image-audit/catalog-membership.json
            build/uup-image-audit/service-registrations.json
            build/uup-image-audit/pe-audit/**
          if-no-files-found: warn
          retention-days: 7
