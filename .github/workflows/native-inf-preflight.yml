name: Server 2022 native INF preflight
on:
  push:
    branches: [experiment/server2022-native-inf-preflight]
    paths: [.github/workflows/native-inf-preflight.yml]
permissions: {}
jobs:
  preflight:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Query native INF namespace and compare explicit append controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Hosted runner required' }
          $os = Get-CimInstance Win32_OperatingSystem
          if ($os.BuildNumber -ne '20348' -or $os.ProductType -ne 3) { throw 'Unexpected OS' }
          "OS=$($os.Caption) BUILD=$($os.BuildNumber) UBR=$((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').UBR)"
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Inf {
            [DllImport("setupapi.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern IntPtr SetupOpenInfFileW(string file, IntPtr cls, uint style, IntPtr line);
            [DllImport("setupapi.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern bool SetupOpenAppendInfFileW(string file, IntPtr handle, IntPtr line);
            [DllImport("setupapi.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern int SetupGetLineCountW(IntPtr handle, string section);
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)]
            public struct Signer {
              public uint size;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=260)] public string catalog;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=260)] public string signer;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=260)] public string version;
              public uint score;
            }
            [DllImport("setupapi.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            private static extern bool SetupVerifyInfFileW(string path, IntPtr platform, ref Signer signer);
            public static string Verify(string label, string path) {
              var signer = new Signer { size=(uint)Marshal.SizeOf(typeof(Signer)) };
              bool ok=SetupVerifyInfFileW(path,IntPtr.Zero,ref signer);
              int err=ok ? 0 : Marshal.GetLastWin32Error();
              return String.Format("VERIFY case={0} ok={1} error=0x{2:X8} catalog={3}", label,ok,err,System.IO.Path.GetFileName(signer.catalog));
            }
            [DllImport("setupapi.dll")] public static extern void SetupCloseInfFile(IntPtr handle);
          }
          '@
          $names = 'ks.inf','wdmaudio.inf','microsoft_bluetooth_a2dp_src.inf','microsoft_bluetooth_a2dp.inf','btampm.inf'
          foreach ($n in $names) {
            $h = [Inf]::SetupOpenInfFileW($n,[IntPtr]::Zero,2,[IntPtr]::Zero)
            $err = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
            $opened = $h.ToInt64() -ne -1
            "SYSTEM name=$n opened=$opened error_on_failure=$(if(!$opened){$err})"
            if ($opened) { [Inf]::SetupCloseInfFile($h) }
            if ($n -in 'ks.inf','wdmaudio.inf' -and !$opened) { throw "Missing positive control $n" }
          }
          foreach ($provider in 'ks.inf','wdmaudio.inf') {
            $handle = [Inf]::SetupOpenInfFileW($provider,[IntPtr]::Zero,2,[IntPtr]::Zero)
            try {
              $sections = if ($provider -eq 'ks.inf') { @('KS.Registration') } else { @('WDMAUDIO.Registration','MSSYSFX.CopyFilesAndRegister') }
              foreach ($section in $sections) {
                $lines = [Inf]::SetupGetLineCountW($handle,$section)
                "PROVIDER name=$provider section=$section lines=$lines"
                if ($lines -lt 1) { throw "Missing provider section $section" }
              }
            } finally { [Inf]::SetupCloseInfFile($handle) }
          }
          $root = New-Item -Type Directory -Path (Join-Path $env:RUNNER_TEMP ([guid]::NewGuid()))
          $primary = Join-Path $root 'probe.inf'
          $extra = Join-Path $root 'a2dp-preflight-sibling.inf'
          $header = '[Version]', 'Signature="$Windows NT$"'
          ($header + '[Probe]' + 'Include=a2dp-preflight-sibling.inf' + 'Needs=UniqueSiblingSection') | Set-Content $primary -Encoding unicode
          ($header + '[UniqueSiblingSection]' + 'Answer=42') | Set-Content $extra -Encoding unicode
          foreach ($mode in 'unappended','missing','basename','absolute') {
            $h = [Inf]::SetupOpenInfFileW($primary,[IntPtr]::Zero,2,[IntPtr]::Zero)
            if ($h.ToInt64() -eq -1) { throw 'Cannot open primary fixture' }
            try {
              $append = $null
              $err = $null
              if ($mode -ne 'unappended') {
                $path = switch ($mode) { missing { Join-Path $root 'absent.inf' } basename { Split-Path $extra -Leaf } absolute { $extra } }
                $append = [Inf]::SetupOpenAppendInfFileW($path,$h,[IntPtr]::Zero)
                if (!$append) { $err = [Runtime.InteropServices.Marshal]::GetLastWin32Error() }
              }
              $count = [Inf]::SetupGetLineCountW($h,'UniqueSiblingSection')
              "CONTROL mode=$mode append=$append error_on_failure=$err section_lines=$count"
              if ($mode -eq 'absolute' -and (!$append -or $count -ne 1)) { throw 'Explicit positive control failed' }
              if ($mode -eq 'missing' -and ($append -or $count -ne -1)) { throw 'Missing-file control failed' }
            } finally { [Inf]::SetupCloseInfFile($h) }
          }
          $published = Join-Path $env:windir 'INF\wdmaudio.inf'
          $copy = Join-Path $root 'wdmaudio.inf'
          Copy-Item -LiteralPath $published -Destination $copy
          $originalHash = (Get-FileHash -LiteralPath $published).Hash
          if ((Get-FileHash -LiteralPath $copy).Hash -ne $originalHash) { throw 'Copy mismatch' }
          [Inf]::Verify('published',$published)
          [Inf]::Verify('identical-copy',$copy)
          $octets = [IO.File]::ReadAllBytes($copy)
          # Change one ASCII letter inside an existing comment, preserving encoding and length.
          $utf16 = $octets[0] -eq 255 -and $octets[1] -eq 254
          $encoding = if ($utf16) { [Text.Encoding]::Unicode } else { [Text.Encoding]::Latin1 }
          $body = $encoding.GetString($octets)
          $match = [regex]::Match($body,'(?m)^\s*;[^\r\n]*?([A-Za-z])')
          if (!$match.Success) { throw 'Comment control not found' }
          $index = $match.Groups[1].Index
          if ($utf16) { $index *= 2 }
          $octets[$index] = $octets[$index] -bxor 32
          [IO.File]::WriteAllBytes($copy,$octets)
          $control = [Inf]::SetupOpenInfFileW($copy,[IntPtr]::Zero,2,[IntPtr]::Zero)
          if ($control.ToInt64() -eq -1) { throw 'Modified control INF did not parse' }
          try {
            $lines = [Inf]::SetupGetLineCountW($control,'WDMAUDIO.Registration')
            "MUTATION parsed=True registration_lines=$lines length=$($octets.Length)"
            if ($lines -ne 2) { throw 'Unexpected modified control section' }
          } finally { [Inf]::SetupCloseInfFile($control) }
          if ((Get-FileHash -LiteralPath $copy).Hash -eq $originalHash) { throw 'Mutation failed' }
          [Inf]::Verify('changed-copy',$copy)
          [Inf]::Verify('absent',(Join-Path $root 'absent.inf'))
          $caps = @(Get-WindowsCapability -Online -ErrorAction Stop)
          $matches = @($caps | Where-Object Name -match 'Bluetooth|A2DP')
          "CAPABILITIES total=$($caps.Count) named_matches=$($matches.Count)"
          $matches | Select-Object Name,State | Format-Table
      - name: Compare detached Server inbox INF with PnPUtil import and enumerate component identities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or [Environment]::OSVersion.Version.Build -ne 20348) { throw 'Requires hosted Server 20348' }
          $manifestRoot = Join-Path $env:windir 'WinSxS/Manifests'
          $manifests = @(Get-ChildItem -LiteralPath $manifestRoot -Filter '*.manifest' -File -Force)
          $mums = @(Get-ChildItem -LiteralPath (Join-Path $env:windir 'servicing/Packages') -Filter '*.mum' -File -Force)
          foreach ($set in 'manifests','mums') {
            $items = if ($set -eq 'manifests') { $manifests } else { $mums }
            $profile = @($items | Where-Object Name -match 'a2dp|btampm')
            $bt = @($items | Where-Object Name -match 'bluetooth|bthport')
            "INVENTORY set=$set total=$($items.Count) profile=$($profile.Count) bluetooth=$($bt.Count)"
            $profile | ForEach-Object { "PROFILE $($_.Name)" }
            $bt | Select-Object -First 4 | ForEach-Object { "CONTROL $($_.Name)" }
            if ($items.Count -lt 100) { throw 'Inventory incomplete' }
          }
          $dir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP ([guid]::NewGuid()))
          $file = Join-Path $dir.FullName 'wdmaudio.inf'
          Copy-Item (Join-Path $env:windir 'INF/wdmaudio.inf') $file
          $catalogLines = @(Select-String -LiteralPath $file -Pattern '^\s*CatalogFile(?:\.\S+)?\s*=')
          "DETACHED file=wdmaudio.inf catalog_directives=$($catalogLines.Count) sha256=$((Get-FileHash $file).Hash)"
          $before = @(Get-WindowsDriver -Online | ForEach-Object Driver | Sort-Object)
          $output = & pnputil.exe /add-driver $file 2>&1
          $rc = $LASTEXITCODE
          $output | ForEach-Object { "PNP $_" }
          "PNP_EXIT $rc"
          $after = @(Get-WindowsDriver -Online | ForEach-Object Driver | Sort-Object)
          "OEM_NEW $(@($after | Where-Object { $_ -notin $before }) -join ',')"
          Get-Content (Join-Path $env:windir 'INF/setupapi.dev.log') -Tail 300 | Select-String 'wdmaudio|0xe000|catalog|!!!' | Select-Object -Last 32 | ForEach-Object { "SETUP $($_.Line)" }
          exit 0
      - name: Read all local CBS package XML and test exact profile tokens
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem (Join-Path $env:windir 'servicing/Packages') -Filter '*.mum' -File -Force)
          $ok = 0; $bad = 0; $positive = 0; $matchesFound = 0
          $tokens = 'microsoft_bluetooth_a2dp','btha2dp','btampm'
          function Inspect-Document([string]$xmlText) {
            $document = [xml]$xmlText
            $raw = $document.DocumentElement.OuterXml
            foreach ($token in $tokens) {
              if ($raw.IndexOf($token,[StringComparison]::OrdinalIgnoreCase) -ge 0) { $token }
            }
          }
          $synthetic = @(Inspect-Document '<assembly><driver name="MICROSOFT_BLUETOOTH_A2DP_SRC.INF"/><file name="BtaMPM.sys"/></assembly>')
          if ($synthetic.Count -ne 2) { throw 'Broken detector' }
          foreach ($f in $files) {
            try {
              $doc = [System.Xml.XmlDocument]::new()
              $doc.XmlResolver = $null
              $doc.Load($f.FullName)
              $raw = $doc.DocumentElement.OuterXml
              $hits = @(Inspect-Document $raw)
              $ok++
              $identities = @($doc.SelectNodes("//*[local-name()='assemblyIdentity']/@name") | ForEach-Object Value)
              $btNames = @($identities | Where-Object { $_ -match 'Bluetooth' })
              if ($btNames.Count) {
                $positive++
                if ($f.Name -like 'Microsoft-OneCore-Bluetooth-Package~*') {
                  "OWNER file=$($f.Name) identities=$($identities.Count) names=$($btNames -join ',')"
                }
              }
              if ($hits.Count) { $matchesFound++; "CBS_HIT file=$($f.Name) tokens=$($hits -join ',')" }
            } catch {
              $bad++
              if ($bad -le 4) { "CBS_UNREADABLE file=$($f.Name) reason=$($_.Exception.Message)" }
            }
          }
          "CBS_SCAN total=$($files.Count) parsed=$ok unreadable=$bad profile_packages=$matchesFound bluetooth_identity_controls=$positive synthetic_hits=$($synthetic.Count)"
          if ($ok -eq 0 -or $positive -eq 0) { throw 'CBS coverage control failed' }
      - name: Decode installed Bluetooth deployment metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = Join-Path $env:windir 'WinSxS/Manifests'
          $manifest = @(Get-ChildItem $root -Filter 'amd64_microsoft-onecore-bluetooth-deployment_*.manifest' -File)
          if (!$manifest.Count) { throw 'Bluetooth deployment manifest missing' }
          $components = @(Get-ChildItem (Join-Path $env:windir 'WinSxS') -Directory -Filter 'amd64_microsoft-windows-servicingstack_*')
          $dll = @($components | ForEach-Object { Get-Item (Join-Path $_.FullName 'wcp.dll') -ErrorAction SilentlyContinue } | Sort-Object { [version]$_.VersionInfo.FileVersionRaw } -Descending)
          if (!$dll.Count) { throw 'Cannot locate servicing stack wcp.dll' }
          $source = 'https://raw.githubusercontent.com/martinosani/Win-CBS-Manifest-Decoder/dc6cc3a669f22978f80f4925a552b7fdb7518054/src'
          Set-Location $env:RUNNER_TEMP
          foreach ($script in 'extract-pe-resource.py','decode-dcm-manifest.py') {
            Invoke-WebRequest "$source/$script" -OutFile $script
          }
          python -X utf8 extract-pe-resource.py $dll[0].FullName --id 614
          foreach ($m in $manifest) {
            $xmlPath = Join-Path $env:RUNNER_TEMP 'deployment.xml'
            python -X utf8 decode-dcm-manifest.py -d resource_614.bin -o $xmlPath $m.FullName
            $xml = [Xml.XmlDocument]::new()
            $xml.XmlResolver = $null
            $xml.Load($xmlPath)
            $identity = $xml.DocumentElement.SelectSingleNode("./*[local-name()='assemblyIdentity']")
            if ($identity.GetAttribute('name') -ne 'Microsoft-OneCore-Bluetooth-Deployment') { throw 'Unexpected decoded identity' }
            "DECODED $($m.Name) wcp=$($dll[0].VersionInfo.FileVersionRaw)"
            foreach ($node in $xml.SelectNodes("//*[local-name()='dependency']//*[local-name()='assemblyIdentity'] | //*[local-name()='file']")) {
              "MEMBER $($node.GetAttribute('name')) $($node.GetAttribute('version'))"
            }
          }
      - name: Inspect payload names in Bluetooth deployment dependency manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:RUNNER_TEMP
          $root = Join-Path $env:windir 'WinSxS/Manifests'
          $deployment = [xml](Get-Content -Raw -Encoding UTF8 deployment.xml)
          $children = @($deployment.SelectNodes("//*[local-name()='dependency']//*[local-name()='assemblyIdentity']"))
          $read = 0
          $missing = 0
          $hits = 0
          foreach ($child in $children) {
            $name = $child.GetAttribute('name')
            $version = $child.GetAttribute('version')
            $suffix = if ($name.Length -gt 40) { $name.Substring(0,19) + '..' + $name.Substring($name.Length-19) } else { $name }
            $candidates = @(Get-ChildItem $root -File -Filter "*_${suffix}_*_${version}_*.manifest")
            $found = $false
            foreach ($file in $candidates) {
              if (Test-Path child.xml) { Remove-Item child.xml }
              python -X utf8 decode-dcm-manifest.py -d resource_614.bin -o child.xml $file.FullName
              if ($LASTEXITCODE -ne 0 -or !(Test-Path child.xml)) { continue }
              $doc = [Xml.XmlDocument]::new()
              $doc.XmlResolver = $null
              $doc.Load((Join-Path $env:RUNNER_TEMP 'child.xml'))
              $id = $doc.DocumentElement.SelectSingleNode("./*[local-name()='assemblyIdentity']")
              if ($id.GetAttribute('name') -ne $name) { continue }
              $found = $true
              $read++
              $payload = @($doc.SelectNodes("//*[local-name()='file']/@name") | ForEach-Object Value)
              $profile = @($payload | Where-Object { $_ -match 'a2dp|btampm' })
              $hits += $profile.Count
              "CHILD $name files=$($payload -join ',') profile=$($profile.Count)"
            }
            if (!$found) { $missing++; "CHILD_UNRESOLVED $name $version candidates=$($candidates.Count)" }
          }
          "COVERAGE dependencies=$($children.Count) manifests=$read unresolved=$missing profile_files=$hits"
