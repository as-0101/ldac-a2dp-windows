name: build

on:
  push:
    branches:
      - experiment/win10-a2dp-symbol-audit-20261124
    paths:
      - tools/research/audit_pe_binary.py
      - tools/research/fetch_win10_a2dp_binaries.py
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-binary-audit:
    name: Fetch Microsoft binaries and compare PE imports
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned static-analysis tools
        run: python -m pip install --disable-pip-version-check --no-input winbindex==3.0.0 pefile==2024.8.26

      - name: Validate research scripts
        run: python -m py_compile tools/research/audit_pe_binary.py tools/research/fetch_win10_a2dp_binaries.py

      - name: Fetch exact Win10 package binaries and Server 2022 references
        run: |
          mkdir -p build/win10-a2dp-symbol-audit
          python tools/research/fetch_win10_a2dp_binaries.py --out build/win10-a2dp-symbol-audit
          python -m pip freeze > build/win10-a2dp-symbol-audit/python-packages.txt

      - name: Upload static-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win10-a2dp-symbol-audit
          path: build/win10-a2dp-symbol-audit/**
          if-no-files-found: warn
          retention-days: 30
