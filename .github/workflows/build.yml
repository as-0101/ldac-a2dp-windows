name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Protocol core, codecs, service, tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Build and test (build.cmd)
        shell: cmd
        run: build.cmd

  utility:
    name: Settings utility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ui/LdacConfig -c Release
      - name: Build Bluetooth SDP probe
        shell: cmd
        run: tools\stand\build-sdp-probe.cmd
      - name: Upload SDP probe
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-sdp-probe
          path: build/sdp-probe.exe
          if-no-files-found: error
          retention-days: 7

  driver:
    name: KMDF driver
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      # The runner image has no WDK; take it (with ACX) from NuGet, see driver/Directory.Build.props.
      - name: Restore the WDK from NuGet
        run: nuget restore driver\packages.config -PackagesDirectory driver\packages
      - name: Build (build_driver.cmd Release)
        shell: cmd
        run: build_driver.cmd Release
      - name: Upload unsigned driver build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: ldac-a2dp-driver-unsigned
          path: build/LdacA2dp/Release/**
          if-no-files-found: error
          retention-days: 7
      - name: Build OPPO per-instance SetupAPI tool
        shell: cmd
        run: tools\stand\build-oppo-driver-tool.cmd
      - name: Assemble test-signed physical Server 2022 package
        shell: pwsh
        run: tools\stand\package-oppo-test.ps1
      - name: Generate SHA256 build manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @()
          $paths = @('build\LdacA2dp\Release', 'build\ldac-a2dp-oppo-server2022-test.zip')
          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $items = @(Get-Item -LiteralPath $path)
            } elseif (Test-Path -LiteralPath $path -PathType Container) {
              $items = @(Get-ChildItem -LiteralPath $path -File -Recurse)
            } else {
              throw "Manifest input missing: $path"
            }
            foreach ($item in $items) {
              $files += [pscustomobject]@{
                Path = $item.FullName.Substring($env:GITHUB_WORKSPACE.Length + 1)
                Size = $item.Length
                SHA256 = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash
              }
            }
          }
          $out = 'build\ldac-build-manifest'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $files | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $out 'manifest.json') -Encoding utf8
          $files | Format-Table -AutoSize | Out-String | Write-Host
      - name: Upload SHA256 build manifest
        uses: actions/upload-artifact@v4
        with:
          name: ldac-build-sha256-manifest
          path: build/ldac-build-manifest/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload OPPO Server 2022 test package
        uses: actions/upload-artifact@v4
        with:
          name: ldac-a2dp-oppo-server2022-test
          path: build/ldac-a2dp-oppo-server2022-test.zip
          if-no-files-found: error
          retention-days: 7
