name: ACX 1.0 bind probe — WDK 20348.1 / VS2019 control

on:
  push:
    branches:
      - experiment/acx10-wdk20348-control
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Inspect EWDK 20348.1 and build ACX 1.0 probe
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      probe_built: ${{ steps.build_probe.outputs.probe_built }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate PowerShell and project XML before execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'driver/AcxAudioCodecProbe/Build-AcxAudioCodecProbe-Wdk20348.ps1',
            'driver/AcxAudioCodecProbe/Invoke-AcxAudioCodecProbe-Wdk20348.ps1'
          )
          foreach ($scriptPath in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $scriptPath).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List * | Out-String | Write-Host
              throw "PowerShell parser errors in $scriptPath"
            }
            Write-Host "POWERSHELL_PARSE_OK=$scriptPath"
          }
          [xml]$project = Get-Content 'driver/AcxAudioCodecProbe/AcxAudioCodecProbe-Wdk20348.vcxproj' -Raw
          if (-not $project.Project) { throw 'Legacy WDK project XML did not parse.' }
          Write-Host 'LEGACY_WDK_PROJECT_XML_OK'

      - name: Download EWDK 20348.1, inspect ACX 1.0 stub, and build
        id: build_probe
        shell: pwsh
        run: |
          & .\driver\AcxAudioCodecProbe\Build-AcxAudioCodecProbe-Wdk20348.ps1

      - name: Upload WDK 20348.1 build, stub, and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acx10-wdk20348-control-build
          path: |
            ${{ runner.temp }}\acx10-sample-bind-probe\package\**
            ${{ runner.temp }}\acx10-sample-bind-probe\build\**
            ${{ runner.temp }}\acx10-sample-bind-probe\inputs\**
            ${{ runner.temp }}\acx10-sample-bind-probe\report\**
          if-no-files-found: warn
          retention-days: 14

  hosted-bind-test:
    name: Bind test on disposable Windows Server 2022
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.probe_built == 'true'
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Download the exact WDK 20348.1 build artifact
        uses: actions/download-artifact@v4
        with:
          name: acx10-wdk20348-control-build
          path: ${{ runner.temp }}\acx10-sample-bind-probe

      - name: Verify build provenance and package before runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'acx10-sample-bind-probe'
          $manifest = Get-Content (Join-Path $root 'report\build-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.Toolchain.WdkKitVersion -notlike '10.0.20348*') { throw 'Build artifact is not from the WDK 20348 toolchain.' }
          if ($manifest.Toolchain.AcxVersion -ne '1.0' -or $manifest.Toolchain.KmdfVersion -ne '1.31') { throw 'Build artifact ACX/KMDF tuple is unexpected.' }
          foreach ($name in @('AcxAudioCodecProbe.sys','AcxAudioCodecProbe.inf','AcxAudioCodecProbe.cat','AcxAudioCodecProbe.pdb')) {
            if (-not (Test-Path (Join-Path $root ('package\' + $name)))) { throw "Build package missing $name" }
          }
          $manifest | ConvertTo-Json -Depth 12 | Write-Host

      - name: Install Windows SDK Debugging Tools and LiveKD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $privateRoot = Join-Path $env:RUNNER_TEMP 'acx10-sample-bind-probe-private'
          New-Item -ItemType Directory -Path $privateRoot -Force | Out-Null
          $setup = Join-Path $privateRoot 'winsdksetup.exe'
          Invoke-WebRequest 'https://download.microsoft.com/download/9d2b0e7e-c04f-402c-8ce6-51f1e56028e8/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' -OutFile $setup
          $setupLog = Join-Path $privateRoot 'winsdksetup.log'
          $setupProcess = Start-Process -FilePath $setup -ArgumentList @('/features','OptionId.WindowsDesktopDebuggers','/quiet','/norestart','/log',$setupLog) -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0 -and $setupProcess.ExitCode -ne 3010) {
            throw "Windows SDK Debugging Tools setup failed: $($setupProcess.ExitCode)"
          }
          $kdPath = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits\10\Debuggers\x64\kd.exe'
          if (-not (Test-Path -LiteralPath $kdPath)) { throw 'kd.exe missing after Debugging Tools setup.' }

          $liveZip = Join-Path $privateRoot 'LiveKD.zip'
          Invoke-WebRequest 'https://download.sysinternals.com/files/LiveKD.zip' -OutFile $liveZip
          $liveDir = Join-Path $privateRoot 'livekd'
          Expand-Archive -LiteralPath $liveZip -DestinationPath $liveDir -Force
          $live = Get-ChildItem -LiteralPath $liveDir -Filter 'livekd.exe' -File -Recurse | Select-Object -First 1
          if (-not $live) { throw 'LiveKD.exe missing from the official Sysinternals archive.' }
          $kdDir = Split-Path -Parent $kdPath
          $liveKdPath = Join-Path $kdDir 'livekd.exe'
          Copy-Item -LiteralPath $live.FullName -Destination $liveKdPath -Force
          New-Item -Path 'HKCU:\Software\Sysinternals\LiveKd' -Force | Out-Null
          New-ItemProperty -Path 'HKCU:\Software\Sysinternals\LiveKd' -Name EulaAccepted -PropertyType DWord -Value 1 -Force | Out-Null
          New-Item -ItemType Directory -Path 'C:\Symbols' -Force | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "KD_PATH=$kdPath"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LIVEKD_PATH=$liveKdPath"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "_NT_SYMBOL_PATH=srv*C:\Symbols*https://msdl.microsoft.com/download/symbols"
          $toolInfo = [pscustomobject]@{
            KDPath = $kdPath
            KDVersion = (Get-Item -LiteralPath $kdPath).VersionInfo.FileVersion
            LiveKDPath = $liveKdPath
            LiveKDVersion = (Get-Item -LiteralPath $liveKdPath).VersionInfo.FileVersion
          }
          $toolInfo | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:RUNNER_TEMP 'acx10-sample-bind-probe\report\debugger-tools.json') -Encoding utf8

      - name: Run ACX 1.0 bind probe with full pre-install mirror and WDF type capture
        shell: pwsh
        run: |
          & .\driver\AcxAudioCodecProbe\Invoke-AcxAudioCodecProbe-Wdk20348.ps1

      - name: Final cleanup and private-key artifact guard
        if: always()
        shell: pwsh
        run: |
          & .\driver\AcxAudioCodecProbe\Invoke-AcxAudioCodecProbe-Wdk20348.ps1 -CleanupOnly -StrictCleanup

      - name: Upload hosted bind report and signed package (public certificate only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acx10-wdk20348-control-runtime
          path: |
            ${{ runner.temp }}\acx10-sample-bind-probe\package\**
            ${{ runner.temp }}\acx10-sample-bind-probe\build\**
            ${{ runner.temp }}\acx10-sample-bind-probe\inputs\**
            ${{ runner.temp }}\acx10-sample-bind-probe\report\**
          if-no-files-found: warn
          retention-days: 14
